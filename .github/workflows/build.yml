name: Build Sukot VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Xray core library
        run: |
          mkdir -p app/libs
          curl -fSL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar"
          ls -la app/libs

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/sukot.jks" \
            -alias sukot \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sukot123456 -keypass sukot123456 \
            -dname "CN=Sukot VPN, OU=Sukot, O=Sukot, L=Tehran, C=IR"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Psukot.store.file="$GITHUB_WORKSPACE/sukot.jks" \
            -Psukot.store.password=sukot123456 \
            -Psukot.key.alias=sukot \
            -Psukot.key.password=sukot123456

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukotVPN-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sukot VPN — Build ${{ github.run_number }}
          body: |
            **Sukot VPN** — automatic build from the latest source.

            ## Download
            Install the APK below (universal: arm64 + arm32 + x86).

            ## Changes
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
